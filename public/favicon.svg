<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- Fundo -->
  <rect width="64" height="64" rx="14" fill="#082C47"/>

  <!-- Linhas de conexão (desenhadas primeiro, ficam atrás dos nós) -->
  <g stroke="#38BDF8" stroke-width="2" stroke-linecap="round" opacity="0.9">
    <line x1="32" y1="32" x2="16" y2="16"/>
    <line x1="32" y1="32" x2="48" y2="16"/>
    <line x1="32" y1="32" x2="16" y2="48"/>
    <line x1="32" y1="32" x2="48" y2="48"/>
  </g>

  <!-- Nó central (maior) -->
  <circle cx="32" cy="32" r="7" fill="#38BDF8"/>
  <circle cx="32" cy="32" r="7" fill="none" stroke="#7DD3FC" stroke-width="1.5" opacity="0.6"/>

  <!-- Nós satélite -->
  <circle cx="16" cy="16" r="4.5" fill="#7DD3FC"/>
  <circle cx="48" cy="16" r="4.5" fill="#7DD3FC"/>
  <circle cx="16" cy="48" r="4.5" fill="#7DD3FC"/>
  <circle cx="48" cy="48" r="4.5" fill="#7DD3FC"/>
</svg>